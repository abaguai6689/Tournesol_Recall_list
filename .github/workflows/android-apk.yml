name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ci/android-apk-build
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web bundle into Android assets
        run: |
          set -euo pipefail
          dest="android/app/src/main/assets"
          test -f dist/index.html
          rm -rf "$dest"
          mkdir -p "$dest"
          cp dist/index.html "$dest/index.html"
          cp -r dist/assets "$dest/assets"
          find "$dest" -maxdepth 2 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner image already ships the Android SDK, and
      # android-actions/setup-android currently fails on it because
      # `sdkmanager tools` no longer resolves to a package.
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$sdkmanager"
          {
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_HOME=$sdk_root"
            echo "SDKMANAGER=$sdkmanager"
          } >> "$GITHUB_ENV"
          yes | "$sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed | sed -n '1,40p'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug and release APKs
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Sign release APK
        working-directory: android
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          ls -l "$apk_dir"
          unsigned="$(find "$apk_dir" -maxdepth 1 -name '*.apk' ! -name '*-signed.apk' | sort | head -n 1)"
          test -n "$unsigned"
          echo "Signing: $unsigned"

          apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -name apksigner -type f | sort | tail -n 1)"
          echo "apksigner: $apksigner"
          test -x "$apksigner"
          "$apksigner" version

          # Prefer a repository-provided keystore, then a pre-existing debug
          # keystore, and finally a throwaway one generated for this run.
          keystore=""
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "${CI_KEYSTORE_BASE64:-}" ]; then
            keystore="$RUNNER_TEMP/keystore/ci.jks"
            printf '%s' "$CI_KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_pass="${CI_KEYSTORE_PASSWORD:-android}"
            key_alias="${CI_KEYSTORE_ALIAS:-recall-lite}"
            echo "Using keystore from ANDROID_KEYSTORE_BASE64"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; looking for a debug keystore"
            echo "--- ${HOME}/.android ---"
            ls -la "$HOME/.android" 2>/dev/null || true
            keystore="$(find "$HOME" -name 'debug.keystore' -type f 2>/dev/null | head -n 1)"
            store_pass="android"
            key_alias="androiddebugkey"
            if [ -z "$keystore" ]; then
              echo "No debug keystore found; generating a throwaway signing key"
              keystore="$RUNNER_TEMP/keystore/ci.jks"
              keytool -genkeypair -noprompt \
                -keystore "$keystore" \
                -storetype PKCS12 \
                -alias recall-lite \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Recall Lite CI, OU=CI, O=Recall Lite, L=NA, ST=NA, C=CN"
              store_pass="android"
              key_alias="recall-lite"
            fi
          fi
          echo "keystore: $keystore (alias: $key_alias)"

          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$store_pass" \
            --key-pass "pass:$store_pass" \
            --ks-key-alias "$key_alias" \
            --out "app/build/outputs/apk/release/app-release-signed.apk" \
            "$unsigned"
          "$apksigner" verify --print-certs "app/build/outputs/apk/release/app-release-signed.apk"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/recall-lite-debug.apk
          cp android/app/build/outputs/apk/release/app-release-signed.apk artifacts/recall-lite-release.apk
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: recall-lite-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
