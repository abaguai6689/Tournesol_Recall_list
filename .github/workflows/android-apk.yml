name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ci/android-apk-build
      - main

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web bundle into Android assets
        run: |
          set -euo pipefail
          dest="android/app/src/main/assets"
          test -f dist/index.html
          rm -rf "$dest"
          mkdir -p "$dest"
          cp dist/index.html "$dest/index.html"
          cp -r dist/assets "$dest/assets"
          find "$dest" -maxdepth 2 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner image already ships the Android SDK, and
      # android-actions/setup-android currently fails on it because
      # `sdkmanager tools` no longer resolves to a package.
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -n 1)"
          test -n "$sdkmanager"
          {
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_HOME=$sdk_root"
            echo "SDKMANAGER=$sdkmanager"
          } >> "$GITHUB_ENV"
          yes | "$sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed | sed -n '1,40p'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug and release APKs
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Sign release APK with the CI debug keystore
        working-directory: android
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            apksigner="$(command -v apksigner)"
          fi
          keystore="${HOME}/.android/debug.keystore"
          test -f "$keystore"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "app/build/outputs/apk/release/app-release-signed.apk" \
            "$unsigned"
          "$apksigner" verify --print-certs "app/build/outputs/apk/release/app-release-signed.apk"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/recall-lite-debug.apk
          cp android/app/build/outputs/apk/release/app-release-signed.apk artifacts/recall-lite-release.apk
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: recall-lite-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
